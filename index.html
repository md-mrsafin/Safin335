<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Modern Portfolio</title>

<style>
  body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: #e2e8f0;
    transition: 0.3s;
  }

  body.light {
    background: #f8fafc;
    color: #0f172a;
  }

  header {
    text-align: center;
    padding: 80px 20px;
    background: linear-gradient(135deg, #1e293b, #0f172a);
  }

  nav {
    position: sticky;
    top: 0;
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 15px;
    background: #111827;
    z-index: 10;
  }

  nav a {
    color: inherit;
    text-decoration: none;
    padding: 6px 10px;
  }

  nav a.active {
    border-bottom: 2px solid #38bdf8;
  }

  section {
    max-width: 900px;
    margin: auto;
    padding: 60px 20px;
    opacity: 0;
    transform: translateY(20px);
    transition: 0.6s;
  }

  section.show {
    opacity: 1;
    transform: translateY(0);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
  }

  .card {
    padding: 15px;
    border-radius: 10px;
    background: #1e293b;
    transition: 0.3s;
  }

  body.light .card {
    background: #e2e8f0;
  }

  .card:hover {
    transform: translateY(-5px);
  }

  button {
    margin: 5px;
    padding: 8px 12px;
    border: none;
    cursor: pointer;
    border-radius: 6px;
  }

  .toggle {
    position: fixed;
    right: 20px;
    top: 20px;
    background: #38bdf8;
  }

  #topBtn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    display: none;
    background: #38bdf8;
  }
</style>
</head>

<body>

<button class="toggle" onclick="toggleTheme()">Toggle Theme</button>
<button id="topBtn" onclick="topFunction()">Top</button>

<header>
  <h1>My Portfolio</h1>
  <p>Student • Developer • Learner</p>
</header>

<nav>
  <a href="#about">About</a>
  <a href="#projects">Projects</a>
  <a href="#contact">Contact</a>
</nav>

<section id="about">
  <h2>About Me</h2>
  <p>I build small projects and learn web development.</p>
</section>

<section id="projects">
  <h2>Projects</h2>

  <button onclick="filterProjects('all')">All</button>
  <button onclick="filterProjects('web')">Web</button>
  <button onclick="filterProjects('app')">App</button>

  <div class="grid">
    <div class="card project web">Portfolio Website</div>
    <div class="card project app">Todo App</div>
    <div class="card project web">Blog Site</div>
  </div>
</section>

<section id="contact">
  <h2>Contact</h2>
  <p>Email: example@mail.com</p>
</section>

<script>
  // Theme toggle
  function toggleTheme() {
    document.body.classList.toggle("light");
  }

  // Scroll reveal
  const sections = document.querySelectorAll("section");

  window.addEventListener("scroll", () => {
    sections.forEach(sec => {
      const top = sec.getBoundingClientRect().top;
      if (top < window.innerHeight - 100) {
        sec.classList.add("show");
      }
    });

    document.getElementById("topBtn").style.display =
      window.scrollY > 300 ? "block" : "none";
  });

  // Back to top
  function topFunction() {
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // Project filter
  function filterProjects(type) {
    let items = document.querySelectorAll(".project");

    items.forEach(item => {
      if (type === "all") {
        item.style.display = "block";
      } else {
        item.style.display = item.classList.contains(type)
          ? "block"
          : "none";
      }
    });
  }
</script>

</body>
</html>
